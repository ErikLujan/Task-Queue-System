services:
  redis:
    image: redis:7-alpine
    container_name: tqs_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: tqs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tqs_api
    restart: unless-stopped
    command: >
      uv run uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: tqs_worker
    restart: unless-stopped
    command: >
      uv run celery -A src.workers.celery_app.celery_app worker
      --loglevel=info
      --queues=emails,images,reports,default
      --concurrency=4
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./tmp:/app/tmp
      - ./logs:/app/logs

  beat:
    build: .
    container_name: tqs_beat
    restart: unless-stopped
    command: >
      uv run celery -A src.workers.celery_app.celery_app beat
      --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  flower:
    build: .
    container_name: tqs_flower
    restart: unless-stopped
    command: >
      uv run celery -A src.workers.celery_app.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "127.0.0.1:5555:5555"
    env_file: .env
    depends_on:
      - redis

volumes:
  redis_data:
  postgres_data: